name: 🐳 Build OJingJing Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk ./OJingJing-v2.1.apk
          echo "✅ APK Created Successfully: $(du -sh OJingJing-v2.1.apk | cut -f1)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJingJing-v2.1-APK
          path: ./OJingJing-v2.1.apk
          retention-days: 30
